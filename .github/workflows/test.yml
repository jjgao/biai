name: Test & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      clickhouse:
        image: clickhouse/clickhouse-server:latest
        ports:
          - 8123:8123
          - 9000:9000
        env:
          CLICKHOUSE_DB: biai
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install ClickHouse client
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https ca-certificates curl gnupg
          curl -fsSL 'https://packages.clickhouse.com/rpm/lts/repodata/repomd.xml.key' | sudo gpg --dearmor -o /usr/share/keyrings/clickhouse-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/clickhouse-keyring.gpg] https://packages.clickhouse.com/deb stable main" | sudo tee /etc/apt/sources.list.d/clickhouse.list
          sudo apt-get update
          sudo apt-get install -y clickhouse-client

      - name: Wait for ClickHouse
        run: |
          for i in {1..30}; do
            if clickhouse-client --host localhost --query "SELECT 1" > /dev/null 2>&1; then
              echo "ClickHouse is ready"
              exit 0
            fi
            echo "Waiting for ClickHouse..."
            sleep 1
          done
          echo "ClickHouse failed to start"
          exit 1

      - name: Initialize ClickHouse database
        run: |
          for f in clickhouse/init/*.sql; do
            echo "Running $f..."
            clickhouse-client --host localhost --multiquery < "$f"
          done

      - name: Run server tests
        run: npm test --workspace=server

      - name: Run client tests
        run: npm test --workspace=client

      - name: Build client
        run: npm run build --workspace=client

      - name: Build server
        run: npm run build --workspace=server
