services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3.4
    container_name: biai-clickhouse
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-biai}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-biai}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    networks:
      - biai-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-biai}", "--password", "${CLICKHOUSE_PASSWORD:-CHANGE_ME_IN_PRODUCTION}", "--query", "SELECT 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: biai-server
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - CLICKHOUSE_HOST=http://clickhouse:8123
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-biai}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-biai}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-CHANGE_ME_IN_PRODUCTION}
      - PORT=5001
      - LOG_LEVEL=${LOG_LEVEL:-info}
    networks:
      - biai-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: biai-client
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${CLIENT_PORT:-80}:80"
    networks:
      - biai-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  biai-network:
    driver: bridge

volumes:
  clickhouse_data:
